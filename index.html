<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>观赏站点</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1a1a22;
            color: #ffffff;
            padding: 20px 15px;
            max-width: 720px;
            margin: 0 auto;
        }
        /* 封面图片 */
        .cover-box {
            width: 100%;
            border-radius:14px;
            overflow:hidden;
            margin-bottom:24px;
        }
        .cover-box img {
            width:100%;
            display:block;
            object-fit:cover;
        }
        /* 头像+昵称区域 */
        .user-info{
            display:flex;
            align-items:center;
            gap:14px;
            margin-bottom:30px;
        }
        .avatar{
            width:64px;
            height:64px;
            border-radius:50%;
            overflow:hidden;
            border:2px solid #4488ff;
        }
        .avatar img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .username{
            font-size:19px;
            font-weight:bold;
        }
        /* 4个卡片容器 */
        .card-wrap{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:16px;
            margin-bottom:40px;
        }
        .card-item{
            background:#272733;
            border-radius:12px;
            padding:22px 14px;
            text-align:center;
            border:1px solid #383848;
        }
        .card-item a{
            color:#fff;
            text-decoration:none;
            font-size:16px;
            display:block;
        }
        .card-item:hover{
            border-color:#4488ff;
        }
        /* 底部提示文字 */
        .footer-tip{
            margin-top:50px;
            text-align:center;
            font-size:14px;
            color:#bbbbcc;
            line-height:2.2;
        }
                /* 唤起浏览器弹窗遮罩 */
        .browser-modal{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            z-index:9999;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .modal-inner{
            background:#272733;
            border-radius:14px;
            padding:30px 24px;
            text-align:center;
        }
        .modal-inner h3{
            margin-bottom:12px;
        }
        .modal-inner p{
            line-height:1.7;
            color:#ddd;
            margin-bottom:20px;
        }
        .open-btn{
            background:#4488ff;
            color:#fff;
            border:none;
            padding:12px 24px;
            border-radius:8px;
            font-size:16px;
        }
    </style>
</head>
<body>
    <div class="browser-modal" id="browserModal">
    <div class="modal-inner">
        <h3>请使用浏览器打开</h3>
        <p>当前App环境限制，无法直接跳转浏览器</p>
        <p style="margin:12px 0;font-size:14px;">🔗访问地址：<br><span id="showUrlText" style="user-select:all;background:#111;padding:6px;border-radius:4px;"></span></p>
        <button class="open-btn" id="openBrowserBtn">尝试复制链接</button>
        <p style="margin-top:12px;font-size:12px;color:#aaa;">复制失败请长按上面链接文字手动复制</p>
    </div>
    </div>
    <!-- ==========【自定义修改区域】在这里改内容 ========== -->
    <!-- 1.封面图片地址，替换引号内链接 -->
    <div class="cover-box">
        <img src="https://tse3.mm.bing.net/th/id/OIP.VVMDvnkPjFSRP2JCX1R5VQHaEo?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="封面">
    </div>

    <!-- 2.头像 + 昵称 -->
    <div class="user-info">
        <div class="avatar">
            <img src="https://img.itouxiang.com/m12/5a/97/e53eeb01fc68.jpg" alt="头像">
        </div>
        <div class="username">点下方卡片立即观赏</div>
    </div>

    <!-- 3.四张跳转卡片，修改文字和href跳转地址 -->
    <div class="card-wrap">
        <div class="card-item">
            <a href="https://wpd9g9yc.oss-cn-qingdao.aliyuncs.com/?706802,7165,7&fo=1">卡片通道1<br>点击立即观赏</a>
        </div>
        <div class="card-item">
            <a href="https://wpd9g9yc.oss-cn-qingdao.aliyuncs.com/?706802,7165,7&fo=1k">卡片通道2<br>点击立即观赏</a>
        </div>
        <div class="card-item">
            <a href="https://wpd9g9yc.oss-cn-qingdao.aliyuncs.com/?706802,7165,7&fo=1">卡片通道3<br>点击立即观赏</a>
        </div>
        <div class="card-item">
            <a href="https://wpd9g9yc.oss-cn-qingdao.aliyuncs.com/?706802,7165,7&fo=1">卡片通道4<br>点击立即观赏</a>
        </div>
    </div>

    <!-- 底部固定提示文案，不用改 -->
    <div class="footer-tip">
        保存本站永久观赏<br>
        如遇打不开请点击其他卡片通道观赏<br>
        各卡片之间不互通，在哪个卡片购买，就点哪个卡片已购，即可继续观赏！
    </div>
    <script>
//填写你的网站完整url
const SITE_URL = "https://yyyy-eqt.pages.dev/";

//检测内嵌webview
function isInnerWebView() {
    const ua = navigator.userAgent.toLowerCase();
    return /micromessenger|wxwork|douyin|qq\//.test(ua);
}

//构建安卓intent唤起浏览器链接
function buildIntentUrl(url){
    const u = new URL(url);
    return `intent://${u.host}${u.pathname}#Intent;scheme=${u.protocol.slice(0,-1)};S.browser_fallback_url=${encodeURIComponent(url)};end`;
}

const modal = document.getElementById("browserModal");
const openBtn = document.getElementById("openBrowserBtn");

if(isInnerWebView()){
    modal.style.display = "flex";
}

openBtn.addEventListener("click",async function(){
    const ua = navigator.userAgent.toLowerCase();
    //安卓尝试intent协议唤起浏览器
    if(ua.indexOf("android") !== -1){
        const intentHref = buildIntentUrl(SITE_URL);
        let aTag = document.createElement('a');
        aTag.href = intentHref;
        document.body.appendChild(aTag);
        aTag.click();
        document.body.removeChild(aTag);
    }

    //延时判断，如果唤起失败，降级复制链接
    setTimeout(async ()=>{
        try {
            await navigator.clipboard.writeText(SITE_URL);
            alert("✅链接已复制！\n请打开系统浏览器粘贴访问");
        } catch (err) {
            alert("复制失败，请手动复制地址：\n"+SITE_URL);
        }
    },400);
});
</script>
    
</body>
</html>
