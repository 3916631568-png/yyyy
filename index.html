<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>观赏站点</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1a1a22;
            color: #ffffff;
            padding: 20px 15px;
            max-width: 720px;
            margin: 0 auto;
        }
        /* 封面图片 */
        .cover-box {
            width: 100%;
            border-radius:14px;
            overflow:hidden;
            margin-bottom:24px;
        }
        .cover-box img {
            width:100%;
            display:block;
            object-fit:cover;
        }
        /* 头像+昵称区域 */
        .user-info{
            display:flex;
            align-items:center;
            gap:14px;
            margin-bottom:30px;
        }
        .avatar{
            width:64px;
            height:64px;
            border-radius:50%;
            overflow:hidden;
            border:2px solid #4488ff;
        }
        .avatar img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .username{
            font-size:19px;
            font-weight:bold;
        }
        /* 4个卡片容器 */
        .card-wrap{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:16px;
            margin-bottom:40px;
        }
        .card-item{
            background:#272733;
            border-radius:12px;
            padding:22px 14px;
            text-align:center;
            border:1px solid #383848;
        }
        .card-item a{
            color:#B5A642;
            text-decoration:none;
            font-size:16px;
            display:block;
        }
        .card-item:hover{
            border-color:#4488ff;
        }
        /* 底部提示文字 */
        .footer-tip{
            margin-top:50px;
            text-align:center;
            font-size:14px;
            color:#bbbbcc;
            line-height:2.2;
        }
                /* 唤起浏览器弹窗遮罩 */
        .browser-modal{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            z-index:9999;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .modal-inner{
            background:#272733;
            border-radius:14px;
            padding:30px 24px;
            text-align:center;
        }
        .modal-inner h3{
            margin-bottom:12px;
        }
        .modal-inner p{
            line-height:1.7;
            color:#ddd;
            margin-bottom:20px;
        }
        .open-btn{
            background:#4488ff;
            color:#fff;
            border:none;
            padding:12px 24px;
            border-radius:8px;
            font-size:16px;
        }
    </style>
</head>
<body>

    <script>
// =========改成你的网站完整网址========
const SITE_URL = "https://yyyy-eqt.pages.dev/";

//兼容双方案复制函数
function copyText(text){
    return new Promise((resolve,reject)=>{
        if(navigator.clipboard){
            navigator.clipboard.writeText(text).then(resolve).catch(()=>{
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position='fixed';
                ta.style.left='-9999px';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                ok?resolve():reject();
            })
        }else{
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position='fixed';
            ta.style.left='-9999px';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            document.body.removeChild(ta);
            ok?resolve():reject();
        }
    })
}

//填充链接到替换区域
document.getElementById("midUrlText").innerText = SITE_URL;

//复制按钮点击事件
document.getElementById("midCopyBtn").addEventListener("click",async function(){
    try{
        await copyText(SITE_URL);
        alert("✅链接复制成功！打开手机浏览器粘贴访问");
    }catch(e){
        alert("❌复制失败！长按上方链接文字手动复制");
    }
});
</script>
