        /* 手机端背景图兜底方案：用固定定位的层铺底，兼容 iOS/微信 */
        html { background: #1a1a22; }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://th.bing.com/th/id/OIP.-lfiLU0SedCHTbLCGwVERgAAAA?w=160&h=349&c=7&r=0&o=7&pid=1.7&rm=3');

            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;

        .cover-box img {
            width:100%;
            display:block;
            object-fit:cover;
        }
        /* 头像+昵称区域 */
        .user-info{
            display:flex;
            align-items:center;
            gap:14px;
            margin-bottom:30px;
        }
        .avatar{
            width:64px;
            height:64px;
            border-radius:50%;
            overflow:hidden;
            border:2px solid #4488ff;
        }
        .avatar img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .username{
            font-size:19px;
            font-weight:bold;
        }
        /* 4个卡片容器 */
        .card-wrap{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:16px;
            margin-bottom:40px;
        }
        .card-item{
            background:#272733;
            border-radius:12px;
            padding:22px 14px;
            text-align:center;
            border:1px solid #383848;
        }
        .card-item a{
            color:#B5A642;
            text-decoration:none;
            font-size:16px;
            display:block;
        }
        .card-item:hover{
            border-color:#4488ff;
        }
        /* 底部提示文字 */
        .footer-tip{
            margin-top:50px;
            text-align:center;
            font-size:14px;
            color:#bbbbcc;
            line-height:2.2;
        }
                /* 唤起浏览器弹窗遮罩 */
        .browser-modal{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            z-index:9999;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .modal-inner{
            background:#272733;
            border-radius:14px;
            padding:30px 24px;

        }
        .modal-inner h3{
            margin-bottom:12px;
        }

            line-height:1.7;
            color:#ddd;
            margin-bottom:20px;
        }
        .open-btn{
            background:#4488ff;
            color:#fff;
            border:none;
            padding:12px 24px;
            border-radius:8px;
            font-size:16px;
        }

const SITE_URL = "https://yyyy-eqt.pages.dev/";

async function copyText(text) {
    await navigator.clipboard.writeText(text);
}
//填充链接

//复制按钮点击事件

<!-- ========== 网站访问监控 - 上报脚本（部署完 Worker 后替换下方地址） ========== -->
<script>
(function () {
  // ★★★ 部署完 Worker 后，把下面的地址换成你自己的 Worker 地址 ★★★
  var PIXEL = 'https://yyyy-eqt.pages.dev/report';

  function report(success) {
    try {
      var img = new Image();
      img.src = PIXEL + '?t=' + Date.now() + '&s=' + (success ? '1' : '0');
      img.style.display = 'none';
      document.body.appendChild(img);
      setTimeout(function () { if (img.parentNode) img.parentNode.removeChild(img); }, 800);
    } catch (e) {}
  }

  // 页面加载成功后上报（打开正常）
  if (document.readyState === 'complete') { report(true); }
  else { window.addEventListener('load', function () { report(true); }); }

  // 页面运行出错时上报（打开失败）
  window.addEventListener('error', function (e) {
    if (e && e.error) report(false);
  }, true);
})();
</script>
