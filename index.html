<!-- ========== 网站访问监控 - 上报脚本（部署完 Worker 后替换下方地址） ========== -->
<script>
(function () {
  // ★★★ 部署完 Worker 后，把下面的地址换成你自己的 Worker 地址 ★★★
  var PIXEL = 'https://yyyy-eqt.pages.dev/report';

  function report(success) {
    try {
      var img = new Image();
      img.src = PIXEL + '?t=' + Date.now() + '&s=' + (success ? '1' : '0');
      img.style.display = 'none';
      document.body.appendChild(img);
      setTimeout(function () { if (img.parentNode) img.parentNode.removeChild(img); }, 800);
    } catch (e) {}
  }

  // 页面加载成功后上报（打开正常）
  if (document.readyState === 'complete') { report(true); }
  else { window.addEventListener('load', function () { report(true); }); }

  // 页面运行出错时上报（打开失败）
  window.addEventListener('error', function (e) {
    if (e && e.error) report(false);
  }, true);
})();
</script>
